---
name: Documentation & Repository Integrity

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docs:
    name: Lint & Validate Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb9b905fa189e4c376166672c3f2f230722 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install Linting Tooling
        run: |
          python -m pip install --upgrade pip
          pip install yamllint==1.35.1

      - name: Lint YAML Configurations
        run: |
          yamllint -c .yamllint .

      - name: Verify Documentation Links
        run: |
          python tools/validate_docs.py
