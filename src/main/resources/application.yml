---
spring:
  application:
    name: tracelyt-query-engine

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    io.tracelyt.queryengine: ${LOGGING_LEVEL_IO_TRACELYT_QUERYENGINE:INFO}
